name: Setup Node and install dependencies
description: Sets up Node, enables Corepack, and installs dependencies with a retry loop.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Install dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if yarn install --immutable; then
            exit 0
          fi
          echo "::warning::yarn install failed (attempt $attempt/3)"
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 10))
          fi
        done
        exit 1
