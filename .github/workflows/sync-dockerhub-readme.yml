name: Sync Readme to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - readme.md
      - .github/workflows/sync-dockerhub-readme.yml

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # DOCKERHUB_USERNAME/DOCKERHUB_PASSWORD aren't configured on this repo yet (see todo.md
      # "Still to do") - re-enable once real Docker Hub credentials are added as repo secrets.
      - name: Sync Readme to Docker Hub
        if: false
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          readme-filepath: ./readme.md
