name: Blackbox Tests

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - tests/blackbox/**
      - packages/**
      - package.json
      - yarn.lock
      - .github/workflows/blackbox.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: blackbox-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  common:
    name: common (${{ matrix.redis-image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        redis-image:
          - redis:6-alpine
          - valkey/valkey:8-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare

      # tests/blackbox/docker-compose.yml doesn't exist yet either (manifest-only
      # migration, see todo.md "Still to do") - re-enable once its source tree lands.
      - name: Start services
        if: false
        env:
          REDIS_IMAGE: ${{ matrix.redis-image }}
        run:
          docker compose -f tests/blackbox/docker-compose.yml up auth-saml redis minio minio-mc openldap -d --quiet-pull
          --wait

      # tests/blackbox has no real test files/config yet (manifest-only migration,
      # see todo.md "Still to do") - re-enable once its source tree lands.
      - name: Run tests
        if: false
        run: TEST_DB=sqlite3 yarn run test:blackbox --project common

  db:
    name: ${{ matrix.vendor }} (${{ matrix.redis-image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - sqlite3
          - postgres
          - mysql
          - maria
          - mssql
          - oracle
          # - cockroachdb
        redis-image:
          - redis:6-alpine
          - valkey/valkey:8-alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare
        uses: ./.github/actions/prepare

      # tests/blackbox/docker-compose.yml doesn't exist yet either (manifest-only
      # migration, see todo.md "Still to do") - re-enable once its source tree lands.
      - name: Start database
        if: false
        run: docker compose -f tests/blackbox/docker-compose.yml up ${{ matrix.vendor }} -d --quiet-pull --wait

      - name: MSSQL Set Compatibility Level
        if: false
        run: |
          for i in {1..30}
          do
            docker exec blackbox-mssql-1 \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Test@123' -C \
              -Q "SELECT 1" && break
            sleep 2
          done
          docker exec blackbox-mssql-1 \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Test@123' -C \
            -Q "ALTER DATABASE model SET COMPATIBILITY_LEVEL = 150" \
            -l 30
          echo "MSSQL compatibility level set successfully"

      # tests/blackbox/docker-compose.yml doesn't exist yet either (manifest-only
      # migration, see todo.md "Still to do") - re-enable once its source tree lands.
      - name: Start services
        if: false
        env:
          REDIS_IMAGE: ${{ matrix.redis-image }}
        run: docker compose -f tests/blackbox/docker-compose.yml up redis minio minio-mc -d --quiet-pull --wait

      # tests/blackbox has no real test files/config yet (manifest-only migration,
      # see todo.md "Still to do") - re-enable once its source tree lands.
      - name: Run tests
        if: false
        run: TEST_DB=${{ matrix.vendor }} yarn run test:blackbox --project db
