name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if yarn install --immutable; then
              exit 0
            fi
            echo "::warning::yarn install failed (attempt $attempt/3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Format
        run: yarn format

      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Lint styles
        run: yarn lint:style

      - name: Test
        run: yarn test
