# Please ensure the link in the Directus Studio is updated when renaming this file!
name: Report a bug
description: Create a report to help us improve
body:
  - type: markdown
    attributes:
      value: |
        Hi, thank you for taking the time to create an issue! Before you get started, please ensure the following are correct:

        - I'm using the [latest version](https://github.com/Terrence721/directus-main/releases)
        - There's [no other issue](https://github.com/Terrence721/directus-main/issues?q=is%3Aissue) that already describes the problem.
  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: To Reproduce
      description:
        Steps to reproduce the behavior. Contributors should be able to follow the steps provided in order to reproduce
        the bug. Please include any relevant details that could help with reproduction, such as browser/server/database
        logs, permission setup, schema snapshot (exported from **Settings > Data Model**) etc.
    validations:
      required: true
  - type: input
    attributes:
      label: Directus Version
      placeholder: v11.x.x
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Hosting Strategy
      options:
        - Self-Hosted (Docker Image)
        - Self-Hosted (Custom)
    validations:
      required: true
  - type: input
    attributes:
      label: Database
      description: If applicable, the vendor and version of the database being used. For example, PostgreSQL 16.
